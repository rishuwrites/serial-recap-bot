name: serial-recaps
on:
  # External cron triggers (Google Apps Script / cron-job.org at 12:00 AM IST) use workflow_dispatch or repository_dispatch
  repository_dispatch:
    types: [nightly-12am]
  workflow_dispatch:
    inputs:
      validate_meta_tokens:
        description: "Read-only check of Facebook and Instagram credentials; does not publish"
        type: boolean
        default: false
      only_show:
        description: "Which show to process"
        type: choice
        default: all
        options: [all, kaisi, bhabhi, sohni, rimjhim, mannsundar, atisundar, patibrahma, ishq, saanche]
      video_id:
        description: "Optional: a specific Dangal TV episode video ID (e.g. JNdlYnNneKE) instead of the newest one"
        type: string
        default: ""
      test_mode:
        description: "Quick test: only 3 scenes (~5 min). Keep OFF (false) for full 2-3 min production video"
        type: boolean
        default: false
      upload:
        description: "Upload to YouTube (ON = uploads & schedules for 9 AM - 4 PM IST slots)"
        type: boolean
        default: true
      publish_now:
        description: "Publish immediately? (Keep OFF/false so videos schedule for 9,10,11,12,1,2,3,4 AM-PM IST)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: serial-recap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: inputs.validate_meta_tokens != true
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        show: [kaisi, bhabhi, sohni, rimjhim, mannsundar, atisundar, patibrahma, ishq, saanche]
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - id: chk
        run: |
          S="${{ inputs.only_show }}"
          if [ -z "$S" ] || [ "$S" = "all" ] || [ "$S" = "${{ matrix.show }}" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.chk.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.chk.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0 libharfbuzz0b
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Make recap (with automatic retry on failure)
        if: steps.chk.outputs.run == 'true'
        env:
          SHOW_KEY: ${{ matrix.show }}
          EVENT_NAME: ${{ github.event_name }}
          VIDEO_ID: ${{ inputs.video_id }}
          PUBLISH_NOW: ${{ inputs.publish_now || 'false' }}
          DO_UPLOAD: ${{ github.event_name == 'repository_dispatch' && 'true' || inputs.upload }}
          TEST_MODE: ${{ github.event_name == 'repository_dispatch' && 'false' || inputs.test_mode }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_FLUX_SPACE: ${{ vars.HF_FLUX_SPACE || 'https://black-forest-labs-flux-1-schnell.hf.space' }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FACEBOOK_ENABLED: ${{ vars.FACEBOOK_ENABLED || 'false' }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_APP_ID: ${{ vars.META_APP_ID }}
          META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
          INSTAGRAM_ENABLED: ${{ vars.INSTAGRAM_ENABLED || 'false' }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v26.0' }}
          RENDER_VERTICAL: ${{ vars.RENDER_VERTICAL || 'false' }}
          FACEBOOK_DESCRIPTION: ${{ vars.FACEBOOK_DESCRIPTION }}
          INSTAGRAM_CAPTION: ${{ vars.INSTAGRAM_CAPTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY }}
          SERIAL_CHANNEL_NAME: ${{ vars.SERIAL_CHANNEL_NAME }}
          SERIAL_VOICE: ${{ vars.SERIAL_VOICE }}
          MUSIC_VOLUME: ${{ vars.MUSIC_VOLUME }}
        run: |
          set +e
          for attempt in 1 2; do
            echo "=== [${SHOW_KEY}] Run Attempt ${attempt}/2 ==="
            git pull --rebase -q origin main 2>/dev/null || true
            python recap/main.py
            code=$?
            if [ $code -eq 0 ]; then
              echo "=== [${SHOW_KEY}] Succeeded on attempt ${attempt} ==="
              exit 0
            fi
            echo "=== [${SHOW_KEY}] Attempt ${attempt} failed (exit ${code}). Inspecting status log... ==="
            if [ -f "state/${SHOW_KEY}_status.json" ]; then
              cat "state/${SHOW_KEY}_status.json"
            fi
            if [ $attempt -lt 2 ]; then
              echo "=== [${SHOW_KEY}] Cleaning temporary files & retrying in 45s... ==="
              rm -rf "tmp_${SHOW_KEY}"
              sleep 45
            fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always() && steps.chk.outputs.run == 'true'
        with:
          name: recap-${{ matrix.show }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save state & status logs
        if: always() && steps.chk.outputs.run == 'true'
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add state/ 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing to save"; exit 0; }
          git commit -m "state ${{ matrix.show }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase -q && git push && break
            sleep $((RANDOM % 8 + 3))
          done

  validate-meta-tokens:
    name: validate-meta-tokens
    if: inputs.validate_meta_tokens == true
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Check Facebook and Instagram credentials without publishing
        env:
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v26.0' }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          version = os.environ["META_GRAPH_API_VERSION"]
          checks = [
              ("Facebook Page token", os.environ.get("FACEBOOK_PAGE_ID", ""),
               os.environ.get("FACEBOOK_PAGE_ACCESS_TOKEN", ""), "name"),
              ("Facebook user token", "me",
               os.environ.get("META_USER_ACCESS_TOKEN", ""), "id"),
              ("Instagram account token", os.environ.get("INSTAGRAM_USER_ID", ""),
               os.environ.get("INSTAGRAM_ACCESS_TOKEN", ""), "username"),
          ]
          failed = False
          for label, account_id, token, field in checks:
              if not account_id or not token:
                  print(f"{label}: NOT CONFIGURED (account ID or token secret is missing)")
                  failed = True
                  continue
              url = f"https://graph.facebook.com/{version}/{account_id}?fields={field}"
              request = urllib.request.Request(
                  url, headers={"Authorization": f"Bearer {token}"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.loads(response.read())
                  if account_id != "me" and str(result.get("id")) != account_id:
                      print(f"{label}: FAILED (returned account ID did not match configured ID)")
                      failed = True
                  elif account_id == "me" and not result.get("id"):
                      print(f"{label}: FAILED (Meta did not return a user ID)")
                      failed = True
                  else:
                      print(f"{label}: VALID (read access confirmed)")
              except urllib.error.HTTPError as error:
                  try:
                      body = json.loads(error.read())
                      details = body.get("error", {})
                      message = details.get("message", "request rejected")
                      code = details.get("code", "unknown")
                  except (ValueError, AttributeError):
                      message, code = "unreadable API error response", "unknown"
                  print(f"{label}: INVALID (HTTP {error.code}, Meta code {code}: {message})")
                  failed = True
              except (urllib.error.URLError, TimeoutError, ValueError) as error:
                  print(f"{label}: CHECK FAILED ({type(error).__name__}: {error})")
                  failed = True
          sys.exit(1 if failed else 0)
          PY
